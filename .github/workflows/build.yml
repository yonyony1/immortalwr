name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".config"
      - "diy-*.sh"
      - "files/**"
      - ".github/workflows/build.yml"
      - "custom-feeds.conf"

permissions:
  contents: write
  actions: write

concurrency:
  group: immortalwrt-arthur
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/yonyony1/immortalwrt-guanfangku
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          sudo apt-get -qq update
          sudo apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz ninja-build p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools swig texinfo unzip wget xmlto xxd zlib1g-dev
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
          df -hT

      - name: Clone ImmortalWrt
        working-directory: /workdir
        run: |
          git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Load custom feeds
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && cp -a files openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          find openwrt/files/etc/init.d openwrt/files/usr/sbin openwrt/files/etc/uci-defaults -type f -exec chmod 755 {} \; 2>/dev/null || true
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Defconfig and verify packages
        run: |
          cd openwrt
          make defconfig
          missing=0
          for pkg in luci kmod-usb-net-rndis kmod-usb-net-cdc-ether luci-i18n-base-zh-cn luci-proto-qmi; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "MISSING PACKAGE: $pkg"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          cp .config "$GITHUB_WORKSPACE/config.build"

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=$(date +"%Y%m%d-%H%M")" >> "$GITHUB_ENV"

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          cp -a . "$GITHUB_WORKSPACE/firmware/"
          cp "$GITHUB_WORKSPACE/config.build" "$GITHUB_WORKSPACE/firmware/config.build"
          python3 "$GITHUB_WORKSPACE/scripts/make-factory.py" \
            "$(ls "$GITHUB_WORKSPACE/firmware/"*squashfs-sysupgrade.bin | head -n1)" \
            "$GITHUB_WORKSPACE/firmware"
          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/firmware"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_Arthur${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: firmware
          if-no-files-found: error
          retention-days: 14

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('{0}-{1}', github.run_number, env.FILE_DATE) }}
          name: immortalwrt ${{ env.FILE_DATE }}
          body: |
            JDCloud RE-SS-01
            U-Boot救砖刷机：刷 `*squashfs-factory.bin`，访问 http://192.168.1.1 上传（不要用 /uimage.html）
            ✅日常LuCI升级：使用 `*squashfs-sysupgrade.bin`
            首次刷factory.bin开机，系统会自动初始化overlay分区，配置断电保存。

          files: firmware/*
          fail_on_unmatched_files: true
